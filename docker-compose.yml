version: "3.9"
services:
  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - USE_FILE_CACHE=false
      - CACHE_DIR=/data/cache
      - OSRM_ROUTE_TTL=3600
      - PAIRWISE_TTL=3600
    volumes:
      - ./data/cache:/data/cache
    depends_on:
      - backend

  backend:
    image: your-backend-image
    ports:
      - "8000:8000"

  # Optional Redis service for a production-grade cache (requires code changes to use Redis)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
