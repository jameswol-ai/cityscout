version: "3.9"

services:
  backend:
    build:
      context: ./backend   # adjust if your backend folder is named differently
    command: npm run dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .           # assumes Dockerfile for Streamlit is in project root
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
