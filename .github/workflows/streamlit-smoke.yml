name: CityScout Streamlit Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import CityScout modules
        env:
          USER_DATA_DIR: /tmp/cityscout-user-data
        run: |
          python - <<'PY'
          import importlib
          import pathlib
          import sys

          root = pathlib.Path("modules")
          failures = []
          for path in sorted(root.glob("*.py")):
              if path.name == "__init__.py":
                  continue
              module_name = f"modules.{path.stem}"
              try:
                  importlib.import_module(module_name)
                  print(f"OK  {module_name}")
              except Exception as exc:
                  failures.append((module_name, exc))
                  print(f"FAIL {module_name}: {exc}")
          if failures:
              print("\nModule import failures:")
              for name, exc in failures:
                  print(f"- {name}: {type(exc).__name__}: {exc}")
              sys.exit(1)
          PY

      - name: Start Streamlit
        env:
          USER_DATA_DIR: /tmp/cityscout-user-data
        run: |
          nohup streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            --browser.gatherUsageStats false > /tmp/cityscout-streamlit.log 2>&1 &
          echo $! > /tmp/cityscout-streamlit.pid

      - name: Verify Streamlit HTTP response
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Streamlit did not become healthy. Log follows:"
          cat /tmp/cityscout-streamlit.log
          exit 1

      - name: Show Streamlit log on failure
        if: failure()
        run: cat /tmp/cityscout-streamlit.log || true
